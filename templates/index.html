
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Missão Planeta Limpo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #dcf8e6, #d9f0ff);
      color: #123b32;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    main {
      width: 100%;
      max-width: 1250px;
      background: white;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 10px 30px #00000018;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #07834c;
      font-size: clamp(26px, 3vw, 42px);
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      font-size: 19px;
    }

    .jogo {
      display: grid;
      grid-template-columns: 42% 58%;
      gap: 20px;
      align-items: center;
    }

    .imagem-area {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    #imagem {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: min(75vh, 560px);
      object-fit: contain;
      border-radius: 18px;
    }

    .perguntas {
      background: #f3faf5;
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      min-width: 0;
    }

    #contador {
      font-size: 24px;
      margin: 0 0 18px;
    }

    #frase {
      color: #087d48;
      font-size: 25px;
      font-weight: bold;
      margin: 12px 0;
    }

    .pergunta {
      font-size: 27px;
      line-height: 1.3;
      margin: 18px 0;
    }

    .botoes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 19px;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .preserva {
      background: #168a4c;
      color: white;
    }

    .prejudica {
      background: #dc3035;
      color: white;
    }

    #resultado {
      margin-top: 18px;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    .acerto {
      color: #087d48;
    }

    .erro {
      color: #c5262b;
    }

    .proximo {
      display: none;
      margin-top: 16px;
      background: #1976d2;
      color: white;
    }

    .reiniciar {
      display: none;
      margin-top: 16px;
      background: #087d48;
      color: white;
    }

    @media (max-width: 700px) {
      body {
        align-items: flex-start;
      }

      main {
        padding: 15px;
      }

      .jogo {
        grid-template-columns: 1fr;
      }

      #imagem {
        max-height: 35vh;
      }

      .perguntas {
        padding: 16px;
      }

      .pergunta {
        font-size: 21px;
      }

      #frase {
        font-size: 20px;
      }

      button {
        font-size: 20px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>🌎 Missão Planeta Limpo</h1>
      <p>Colégio Tiradentes • Feira de Ciências</p>
    </header>

    <div class="jogo">

      <div class="imagem-area">
        <img id="imagem" alt="Situação ambiental ilustrada">
      </div>

      <section class="perguntas">
        <h2 id="contador">Preparando desafios...</h2>

        <p id="frase"></p>

        <h2 class="pergunta">
          Essa atitude PRESERVA ou PREJUDICA o planeta?
        </h2>

        <div class="botoes">
          <button
            class="preserva"
            onclick="responder('PRESERVA')">
            🌱 PRESERVA
          </button>

          <button
            class="prejudica"
            onclick="responder('PREJUDICA')">
            🗑️ PREJUDICA
          </button>
        </div>

        <div id="resultado" aria-live="polite"></div>

        <button
          id="proximo"
          class="proximo"
          onclick="proxima()">
          Próxima imagem ➜
        </button>

        <button
          id="reiniciar"
          class="reiniciar"
          onclick="iniciarJogo()">
          🌎 Nova missão!
        </button>
      </section>

    </div>
  </main>

  <script>
    let desafios = [];
    let rodada = [];
    let indice = 0;
    let respondido = false;

    const TOTAL_RODADAS = 3;

    const botoes = document.querySelectorAll(
      ".preserva, .prejudica"
    );

    async function iniciarJogo() {
      try {
        const resposta = await fetch("/desafios");

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar os desafios.");
        }

        desafios = await resposta.json();

        if (!Array.isArray(desafios) || desafios.length === 0) {
          throw new Error("Nenhum desafio foi encontrado.");
        }

        rodada = [...desafios]
          .sort(() => Math.random() - 0.5)
          .slice(0, TOTAL_RODADAS);

        indice = 0;

        mostrarDesafio();

      } catch (erro) {
        document.getElementById("contador").textContent =
          "Não foi possível iniciar o jogo.";

        document.getElementById("resultado").textContent =
          erro.message;
      }
    }

    function mostrarDesafio() {
      respondido = false;

      const desafio = rodada[indice];

      document.getElementById("contador").textContent =
        `Desafio ${indice + 1} de ${rodada.length}`;

      document.getElementById("frase").textContent =
        desafio.frase;

      document.getElementById("imagem").src =
    "/static/imagens/" + desafio.imagem.split("/").pop();

      const resultado = document.getElementById("resultado");

      resultado.textContent = "";
      resultado.className = "";

      botoes.forEach(botao => {
        botao.disabled = false;
      });

      document.getElementById("proximo").style.display = "none";
      document.getElementById("reiniciar").style.display = "none";
    }

    async function responder(escolha) {
      if (respondido) return;

      respondido = true;

      botoes.forEach(botao => {
        botao.disabled = true;
      });

      const desafio = rodada[indice];
      const resultado = document.getElementById("resultado");

      resultado.textContent = "🤖 A inteligência artificial está analisando...";

      try {
        const resposta = await fetch("/responder", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            frase: desafio.frase,
            escolha: escolha
          })
        });

        if (!resposta.ok) {
          throw new Error("Erro ao consultar a inteligência artificial.");
        }

        const dados = await resposta.json();

        if (dados.acertou) {
          resultado.textContent =
            "🎉 Parabéns! Você acertou!";

          resultado.className = "acerto";
        } else {
          resultado.textContent =
            `💡 Quase! Essa atitude ${dados.resposta_correta} o planeta.`;

          resultado.className = "erro";
        }

        if (indice < rodada.length - 1) {
          document.getElementById("proximo").style.display =
            "block";
        } else {
          document.getElementById("contador").textContent =
            "🌟 Missão concluída!";

          document.getElementById("reiniciar").style.display =
            "block";
        }

      } catch (erro) {
        resultado.textContent =
          "Não foi possível verificar. Tente novamente.";

        resultado.className = "erro";

        respondido = false;

        botoes.forEach(botao => {
          botao.disabled = false;
        });
      }
    }

    function proxima() {
      if (!respondido) return;

      indice++;

      if (indice < rodada.length) {
        mostrarDesafio();
      }
    }

    iniciarJogo();
  </script>
</body>
</html>
